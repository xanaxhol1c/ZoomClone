{% extends "base.html" %}

{% block content %}
    <div class="mt-2 main-content">
        <h1>Dashboard</h1>
        <div class="mt-3 dashboard-card">
            <div class="m-3 dashboard-card-content">
                <span style="display: flex; flex-direction: row; justify-content: flex-start; gap:10px;">
                    <h3>Enter meeting ID</h3>
                </span>
                <div class="mt-4 d-flex flex-column">
                    <form method="post" class="d-flex flex-column" action="{% url "zoomApp:join_meeting"%}" style="display: flex; gap: 20px;">
                        {% csrf_token %}
                        <input class="input-field" type="meeting_id" name="meeting_id" placeholder="Meeting ID" required>
                        <button type="submit" class="btn btn-primary submit-btn" style="width: 100px;">Join</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
